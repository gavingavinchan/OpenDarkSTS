name: Real example on Linux and Windows
on:
  workflow_dispatch:
    inputs:
      model_url:
        description: URL of the documented default checkpoint (checksum is pinned in the package)
        required: true
        type: string
permissions:
  contents: read
jobs:
  example:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: |
          python -m pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install '.[test]'
      - name: Acquire and verify release model
        env:
          MODEL_URL: ${{ inputs.model_url }}
        run: |
          python -c "import os; from pathlib import Path; from scripts.acquisition import download; from scripts.initialization import default_manifest; from scripts.workspace import sha256; p=Path('workspace/ci-model/default.pt'); download(os.environ['MODEL_URL'],p); assert sha256(p)==default_manifest()['sha256']"
      - name: Real inference test
        env:
          OPENDARKSTS_TEST_WEIGHTS: workspace/ci-model/default.pt
        run: python -m pytest -q -m integration
