name: Tests and package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install one environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install '.[test]'
      - name: Run core tests
        run: python -m pytest -q -m 'not integration'
      - name: Build and inspect package
        run: |
          python -m build
          python -m opendarksts --workspace workspace/ci-init init --no-model
          python -c "from pathlib import Path; assert (Path('workspace/ci-init/inputs/example/2020-01-24_example.tiff')).is_file()"
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os }}
          path: dist/*
